<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tiverton Civic Intelligence{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0d1b2a;
      --blue:   #1a3a5c;
      --gold:   #c9a84c;
      --light:  #f4f6f9;
      --white:  #ffffff;
      --gray:   #6c757d;
      --border: #dee2e6;
      --text:   #212529;
      --muted:  #6c757d;
      --green:  #198754;
      --red:    #dc3545;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--light);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--navy);
      color: var(--white);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      height: 56px;
    }
    .topbar .brand {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--white);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .topbar .brand span { color: var(--gold); }
    .topbar .subtitle {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.55);
      margin-left: 0.25rem;
    }
    .topbar .badge-demo {
      margin-left: auto;
      background: var(--gold);
      color: var(--navy);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    /* ── Layout ── */
    .container { max-width: 860px; margin: 0 auto; padding: 2rem 1rem; }

    /* ── Cards ── */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* ── Search form ── */
    .search-wrap { display: flex; gap: 0.5rem; }
    .search-wrap input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input[type="text"]:focus { border-color: var(--blue); }
    .btn-ask {
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-ask:hover { background: var(--blue); }

    /* ── Answer box ── */
    .answer-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--navy);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
      line-height: 1.7;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }
    .answer-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--navy);
      margin-bottom: 0.5rem;
    }
    .cite {
      font-size: 0.78rem;
      color: var(--blue);
      font-weight: 600;
    }

    /* ── Source cards ── */
    .source-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      background: var(--white);
    }
    .source-card .src-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .source-card .src-heading {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .source-card .src-body {
      font-size: 0.85rem;
      color: #444;
      line-height: 1.6;
    }
    .source-card a {
      font-size: 0.78rem;
      color: var(--blue);
      text-decoration: none;
    }
    .source-card a:hover { text-decoration: underline; }

    /* ── Document table ── */
    .doc-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .doc-table th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 2px solid var(--border);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .doc-table td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .doc-table tr:last-child td { border-bottom: none; }
    .doc-table a { color: var(--blue); text-decoration: none; font-weight: 500; }
    .doc-table a:hover { text-decoration: underline; }
    .tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--light);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    /* ── Misc ── */
    .alert-error {
      background: #fff5f5;
      border: 1px solid #f5c6cb;
      border-left: 4px solid var(--red);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--red);
    }
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 1.5rem 0 0.75rem;
    }
    .disclaimer {
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 1.5rem;
      padding-top: 1rem;
    }

    /* ── Chunk content (document.html) ── */
    .chunk-block {
      border-left: 3px solid var(--gold);
      padding-left: 1rem;
      margin-bottom: 1.25rem;
    }
    .chunk-heading {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.35rem;
    }
    .chunk-body {
      font-size: 0.88rem;
      line-height: 1.7;
      color: #333;
    }
  </style>
</head>
<body>

<div class="topbar">
  <a href="/" class="brand"><span>&#9876;</span> Tiverton Civic Intelligence</a>
  <span class="subtitle">Meeting minutes · Rhode Island · 2024</span>
  {% if demo_mode is defined and demo_mode %}
  <span class="badge-demo">DEMO</span>
  {% endif %}
</div>

<div class="container">
  {% block content %}{% endblock %}
</div>

</body>
</html>
